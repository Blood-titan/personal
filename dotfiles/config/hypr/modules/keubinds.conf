###############################################
# 🧩 Hyprland Keybinds Configuration (Clean)
###############################################

$mainMod = SUPER  # Main modifier (Windows key)

###############################################
# 🖥️ Core Applications
###############################################
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, nautilus
bind = SUPER, B, exec, Chromium                # Launch Chromium
bind = SUPER SHIFT, B, exec, swaync-client -D  # Toggle DND mode (with Shift)
bind = SUPER CTRL, V, exec, ~/.local/bin/wofi-clipboard

###############################################
# 🔒 System / Session
###############################################
bind = $mainMod, W, killactive,                # Close active window
bind = $mainMod ALT, M, exit,                  # Logout / Exit Hyprland
bind = $mainMod, ESC, exec, wlogout            # Power menu

# Fullscreen & Lock combos
bind = SUPER, F, fullscreen                    # Toggle fullscreen
bind = SUPER ALT, L, exec, $lock               # Lock screen
bind = SUPER SHIFT, F, fullscreen              # Alternate fullscreen toggle (optional)

###############################################
# 📦 Window Management
###############################################
bind = $mainMod, V, togglefloating,            # Toggle floating mode
bind = $mainMod, P, pseudo,                    # Dwindle pseudo split
bind = $mainMod ALT, J, togglesplit,           # Toggle split mode
bind = $mainMod, Space, exec, wofi --show drun # App launcher

# Move focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move window
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

###############################################
# 🧭 Workspaces
###############################################
# Switch workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

###############################################
# 🖱️ Mouse Binds
###############################################
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

###############################################
# 🖼️ Screenshots
###############################################
bind = , Print, exec, ~/.local/bin/screenshot.sh
bind = $mainMod, Print, exec, grim ~/Pictures/Screenshots/screenshot-$(date +'%F-%T').png

###############################################
# 🔔 Notifications (SwayNC)
###############################################
bind = SUPER, N, exec, swaync-client -t        # Toggle panel
bind = SUPER ALT, C, exec, swaync-client -d    # Dismiss all
bind = SUPER SHIFT, N, exec, swaync-client -D  # Toggle DND
bind = SUPER, F12, exec, swaync-client --change-noti-monitor  # Move notifications

###############################################
# ☀️ Hardware Keys / Scripts
###############################################
bind = , XF86Calculator, exec, ~/.local/bin/toggle-calculator
bind = , XF86Launch2, exec, ~/.local/bin/power-toggle.sh
bind = $mainMod, XF86MonBrightnessDown, exec, ~/.local/bin/toggle-sunset

###############################################
# 🌐 Web Apps / Smart Launchers
###############################################
bind = $mainMod SHIFT, A, exec, $chatgpt
bind = $mainMod SHIFT, C, exec, $calendar
bind = $mainMod SHIFT, Y, exec, $youtube
bind = $mainMod SHIFT, W, exec, $whatsapp
bind = $mainMod SHIFT CTRL, G, exec, $messages
bind = $mainMod SHIFT ALT, P, exec, $photos
bind = $mainMod SHIFT, O, exec, obsidian

